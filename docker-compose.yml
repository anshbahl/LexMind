version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lexmind_postgres
    restart: always
    environment:
      POSTGRES_USER: legalens
      POSTGRES_PASSWORD: legalens
      POSTGRES_DB: lexmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lexmind_redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lexmind_server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://legalens:legalens@postgres:5432/lexmind
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: legalens
      PGPASSWORD: legalens
      PGDATABASE: lexmind
      REDIS_URL: redis://redis:6379
      JWT_SECRET: lexmind_super_secret_jwt_key_2026_indian_legal_advocate
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lexmind_client
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  pgdata:

